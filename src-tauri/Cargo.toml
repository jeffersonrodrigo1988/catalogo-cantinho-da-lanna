[package]
name = "catalogo_cantinho_da_lanna"
version = "0.1.0"
description = "Catálogo online Cantinho da Lanna"
authors = ["Lanna"]
edition = "2021"

[lib]
name = "catalogo_cantinho_da_lanna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
