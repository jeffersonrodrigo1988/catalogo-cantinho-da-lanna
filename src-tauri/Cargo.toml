[package]
name = "catalogo_cantinho_da_lanna"
version = "0.1.0"
description = "Catálogo online Cantinho da Lanna"
authors = ["Lanna"]
edition = "2021"

[lib]
name = "catalogo_cantinho_da_lanna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "=1.6.8", features = ["api-all", "windows7-compat"] }

serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"

reqwest = { version = "=0.11.27", features = ["json"] }

base64 = "=0.21.7"
chrono = "=0.4.38"
dotenvy = "=0.15.7"
indexmap = "=2.7.1"

[build-dependencies]
tauri-build = { version = "=1.5.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
